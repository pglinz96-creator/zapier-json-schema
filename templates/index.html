<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Druckerei Auftragsassistent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      padding: 16px;
    }

    /* ── Chat Panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
      color: #fff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .logo {
      width: 40px; height: 40px;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .chat-header h1 { font-size: 18px; font-weight: 600; }
    .chat-header p { font-size: 13px; opacity: .8; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .message.agent .avatar { background: #ebf4ff; }
    .message.user .avatar  { background: #1a365d; color: #fff; }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.agent .bubble {
      background: #f7f9fc;
      border-bottom-left-radius: 4px;
      color: #1a202c;
    }

    .message.user .bubble {
      background: #1a365d;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 14px 16px;
    }

    .typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #a0aec0; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } }

    .chat-input {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #messageInput {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color .2s;
      max-height: 120px;
      min-height: 44px;
    }

    #messageInput:focus { border-color: #2b6cb0; }

    #sendBtn {
      width: 44px; height: 44px;
      border: none; border-radius: 12px;
      background: #1a365d;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    #sendBtn:hover { background: #2b6cb0; }
    #sendBtn:active { transform: scale(.95); }
    #sendBtn:disabled { background: #a0aec0; cursor: not-allowed; }

    /* ── Status Panel ── */
    .status-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 20px;
    }

    .status-card h2 {
      font-size: 14px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b6cb0, #48bb78);
      border-radius: 3px;
      transition: width .4s ease;
    }

    .field-list { display: flex; flex-direction: column; gap: 8px; }

    .field-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
    }

    .field-icon {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0; margin-top: 1px;
    }

    .field-icon.done  { background: #c6f6d5; color: #276749; }
    .field-icon.missing { background: #fed7d7; color: #9b2c2c; }

    .field-label { color: #4a5568; font-weight: 500; }
    .field-value { color: #718096; font-size: 12px; margin-top: 1px; }

    .complete-banner {
      background: linear-gradient(135deg, #276749, #48bb78);
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .complete-banner.show { display: block; }

    .new-order-btn {
      width: 100%;
      padding: 12px;
      background: #1a365d;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }

    .new-order-btn:hover { background: #2b6cb0; }

    .orders-count {
      font-size: 32px;
      font-weight: 700;
      color: #1a365d;
      text-align: center;
    }

    .orders-label {
      font-size: 12px;
      color: #718096;
      text-align: center;
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .app { flex-direction: column; height: 100vh; padding: 8px; }
      .status-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
      .status-card { flex: 1; min-width: 200px; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Chat -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="logo">🖨️</div>
      <div>
        <h1>Druckerei Auftragsassistent</h1>
        <p>Powered by Claude AI</p>
      </div>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <textarea
        id="messageInput"
        placeholder="Beschreiben Sie Ihren Druckauftrag…"
        rows="1"
      ></textarea>
      <button id="sendBtn" title="Senden">➤</button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-panel">
    <div class="status-card">
      <h2>Auftragsfortschritt</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="field-list" id="fieldList"></div>
    </div>

    <div class="status-card" id="completeBanner" style="display:none">
      <div style="text-align:center; font-size:36px; margin-bottom:8px;">✅</div>
      <div style="font-size:15px; font-weight:700; color:#276749; text-align:center;">
        Auftrag aufgenommen!
      </div>
      <button class="new-order-btn" onclick="startNewSession()">
        Neuen Auftrag starten
      </button>
    </div>

    <div class="status-card">
      <h2>Aufträge heute</h2>
      <div class="orders-count" id="ordersCount">–</div>
      <div class="orders-label">abgeschlossene Aufträge</div>
    </div>
  </div>
</div>

<script>
  const FIELD_LABELS = {
    produkt: "Produkt",
    auflage: "Auflage (Stückzahl)",
    format: "Format",
    farbigkeit: "Farbigkeit",
    material: "Material / Papier",
    veredelung: "Veredelung",
    liefertermin: "Liefertermin",
  };
  const REQUIRED_FIELDS = Object.keys(FIELD_LABELS);

  let sessionId = null;
  let filledFields = {};

  async function startNewSession() {
    filledFields = {};
    document.getElementById("messages").innerHTML = "";
    document.getElementById("completeBanner").style.display = "none";
    document.getElementById("messageInput").disabled = false;
    document.getElementById("sendBtn").disabled = false;
    renderFieldList({});
    updateProgress(0);

    const res = await fetch("/api/session", { method: "POST" });
    const data = await res.json();
    sessionId = data.session_id;
    appendMessage("agent", data.message);
    loadOrdersCount();
  }

  function appendMessage(role, text) {
    const el = document.createElement("div");
    el.className = `message ${role}`;
    const icon = role === "agent" ? "🖨️" : "👤";
    el.innerHTML = `
      <div class="avatar">${icon}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    const container = document.getElementById("messages");
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "message agent";
    el.id = "typing";
    el.innerHTML = `
      <div class="avatar">🖨️</div>
      <div class="bubble typing">
        <span></span><span></span><span></span>
      </div>
    `;
    const container = document.getElementById("messages");
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  function renderFieldList(status) {
    const { filled_fields = {}, missing_fields = [] } = status;
    const list = document.getElementById("fieldList");
    list.innerHTML = REQUIRED_FIELDS.map(f => {
      const value = filled_fields[f];
      const done = !!value;
      return `
        <div class="field-item">
          <div class="field-icon ${done ? "done" : "missing"}">${done ? "✓" : "○"}</div>
          <div>
            <div class="field-label">${FIELD_LABELS[f]}</div>
            ${value ? `<div class="field-value">${escapeHtml(value)}</div>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function updateProgress(percent) {
    document.getElementById("progressFill").style.width = `${percent}%`;
  }

  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text || !sessionId) return;

    input.value = "";
    input.style.height = "auto";
    document.getElementById("sendBtn").disabled = true;
    appendMessage("user", text);
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      const data = await res.json();
      hideTyping();

      if (data.error) {
        appendMessage("agent", `Fehler: ${data.error}`);
      } else {
        appendMessage("agent", data.message);

        if (data.status) {
          renderFieldList(data.status);
          const filled = REQUIRED_FIELDS.filter(f => data.status.filled_fields?.[f]).length;
          updateProgress(Math.round((filled / REQUIRED_FIELDS.length) * 100));
        }

        if (data.order_complete) {
          updateProgress(100);
          document.getElementById("completeBanner").style.display = "block";
          document.getElementById("messageInput").disabled = true;
          document.getElementById("sendBtn").disabled = true;
          loadOrdersCount();
        } else {
          document.getElementById("sendBtn").disabled = false;
          input.focus();
        }
      }
    } catch (e) {
      hideTyping();
      appendMessage("agent", "Verbindungsfehler. Bitte versuchen Sie es erneut.");
      document.getElementById("sendBtn").disabled = false;
    }
  }

  async function loadOrdersCount() {
    try {
      const res = await fetch("/api/orders");
      const data = await res.json();
      document.getElementById("ordersCount").textContent = data.total;
    } catch (_) {}
  }

  function escapeHtml(text) {
    const d = document.createElement("div");
    d.textContent = text;
    return d.innerHTML.replace(/\n/g, "<br>");
  }

  // Auto-resize textarea
  document.getElementById("messageInput").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });

  document.getElementById("messageInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById("sendBtn").addEventListener("click", sendMessage);

  // Start
  startNewSession();
</script>
</body>
</html>
